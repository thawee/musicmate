[versions]
# SDK & Toolchain
minSdkVersion = "36"
targetSdkVersion = "37"
compileSdkVersion = "37"
buildTools = "37.0.0"
androidGradlePlugin = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.9"

# Core Architecture & Jetpack
coroutines = "1.11.0"
kotlinxSerializationCore = "1.11.0"
hilt = "2.60.1"
hiltWork = "1.4.0"
room = "2.8.4"

# Media & Playback
media = "1.8.0"
media3Session = "1.11.0"

# UI & Utilities
androidfastscrollKt = "v1.0.8"
zxing-core = "3.5.4"
jsoup = "1.23.2"
#aboutlibraries = "15.0.4"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
composeBom = "2026.08.00"

[libraries]
# Kotlin & Coroutines
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationCore" }

# AndroidX Core & UI
androidx-core = { module = "androidx.core:core", version = "1.19.0" }
androidx-activity = { module = "androidx.activity:activity", version = "1.13.0" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
androidx-appCompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.9.0" }
androidx-cardView = { module = "androidx.cardview:cardview", version = "1.0.0" }
#androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version = "1.3.0" }
androidx-concurrent = { module = "androidx.concurrent:concurrent-futures", version = "1.3.0" }
androidx-recyclerView = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
androidx-recyclerView-selection = { module = "androidx.recyclerview:recyclerview-selection", version = "1.2.0" }
androidx-palette = { module = "androidx.palette:palette", version = "1.0.0" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.2.0" }
androidx-preference = { module = "androidx.preference:preference", version = "1.2.1" }
androidx-documentFile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version = "1.2.0" }
androidx-loader = { module = "androidx.loader:loader", version = "1.2.0" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version = "1.1.0" }


# Jetpack Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }

# AndroidX Lifecycle & WorkManager
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version = "2.11.0" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version = "2.11.0" }
androidx-work = { module = "androidx.work:work-runtime", version = "2.11.2" }

# AndroidX Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# AndroidX Media & Media3
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Session" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Session" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Session" }

# Dagger Hilt
dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel = { module = "androidx.hilt:hilt-lifecycle-viewmodel", version.ref = "hiltWork" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltWork" }

# Google Material & Annotations
google-material = { module = "com.google.android.material:material", version = "1.14.0" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }

# Networking, Storage & UPnP
square-okio = { module = "com.squareup.okio:okio", version = "3.18.1" }
square-okhttp3 = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
jupnp-android = { module = "org.jupnp:org.jupnp.android", version = "3.0.5" }
jupnp-support = { module = "org.jupnp:org.jupnp.support", version = "3.0.5" }
netty-codec-http = { module = "io.netty:netty-codec-http", version = "4.2.17.Final" }
apache-httpcore = { module = "org.apache.httpcomponents.core5:httpcore5", version = "5.5-beta2" }
apache-http2core = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version = "5.5-beta2" }
anggrayudi-storage = { module = "com.anggrayudi:storage", version = "3.0.1" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Image Loading & UI Enhancements
coilkt-coil3 = { module = "io.coil-kt.coil3:coil", version = "3.6.0" }
coilkt-coil3-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.6.0" }
coilkt-coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.6.0" }
androidfastscroll-kt = { module = "com.github.StellarSand:AndroidFastScroll-kt", version.ref = "androidfastscrollKt" }
chrisbanes-photoview = { module = "com.github.chrisbanes:PhotoView", version = "2.3.0" }

tutorialsandroid-filepicker = { module = "io.github.tutorialsandroid:filepicker", version = "10.1.3" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
markwon-core = { module = "io.noties.markwon:core", version = "4.6.2" }
markwon-html = { module = "io.noties.markwon:html", version = "4.6.2" }

# Audio Engine & Math
ffmpegkit-audio = { module = "com.antonkarpenko:ffmpeg-kit-full", version = "2.2.1" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.20.0" }
commons-match3 = { module = "org.apache.commons:commons-math3", version = "3.6.1" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version = "2.2.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
#android-aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }