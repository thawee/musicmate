import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type

// ASM drives the patchHttpCore bytecode rewrite below
buildscript {
    dependencies {
        classpath libs.ow2.asm
    }
}

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.devtools.ksp)
    alias(libs.plugins.dagger.hilt)
}

android {
    compileSdk = libs.versions.compileSdkVersion.get() as Integer
    buildToolsVersion = libs.versions.buildTools.get()

    defaultConfig {
        minSdk = libs.versions.minSdkVersion.get() as Integer
        targetSdk = libs.versions.targetSdkVersion.get() as Integer
    }
    compileOptions {
        sourceCompatibility = JavaLanguageVersion.of(17)
        targetCompatibility = JavaLanguageVersion.of(17)
    }
    buildTypes {
        release {
        }
    }
    lint {
        abortOnError = true
    }
    namespace = 'musicmate.mediaserver.jupnp'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    httpcoreOriginal
}

/**
 * Strips the jdk.net hidden-API references (blocked on Android, see tasks/lessons.md) from the
 * upstream httpcore5 jar, so upgrades need no vendored copies. Every use is guarded by
 * ReflectionUtils.supportsKeepAliveOptions(), which becomes false once supportedOptions() is empty:
 *   getstatic ExtendedSocketOptions.*   -> aconst_null (never executed)
 *   Sockets.setOption(a, b, c)          -> pop x3
 *   Sockets.supportedOptions(Class)     -> pop; Collections.emptySet()
 * Any other jdk/net reference fails the build.
 */
@CacheableTask
abstract class PatchJdkNetTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getSourceJars()

    @OutputFile
    abstract RegularFileProperty getOutputJar()

    @TaskAction
    void patch() {
        def out = outputJar.get().asFile
        out.parentFile.mkdirs()
        int patchedClasses = 0
        new java.util.zip.ZipOutputStream(new FileOutputStream(out)).withCloseable { zos ->
            sourceJars.files.each { jar ->
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { java.util.zip.ZipEntry entry ->
                        byte[] bytes = zip.getInputStream(entry).bytes
                        if (entry.name.endsWith(".class") && new String(bytes, "ISO-8859-1").contains("jdk/net/")) {
                            bytes = PatchJdkNetTask.rewrite(entry.name, bytes)
                            patchedClasses++
                        }
                        zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        zos.write(bytes)
                        zos.closeEntry()
                    }
                }
            }
        }
        if (patchedClasses == 0) {
            logger.warn("patchHttpCore: no jdk/net references found; the patch may be obsolete")
        } else {
            logger.lifecycle("patchHttpCore: patched $patchedClasses classes")
        }
    }

    static byte[] rewrite(String name, byte[] bytes) {
        def reader = new ClassReader(bytes)
        def writer = new ClassWriter(reader, 0)
        reader.accept(new JdkNetStripper(writer), 0)
        byte[] result = writer.toByteArray()
        def leftovers = new JdkNetScanner()
        new ClassReader(result).accept(leftovers, 0)
        if (!leftovers.found.isEmpty()) {
            throw new GradleException("patchHttpCore: unhandled jdk/net references in $name: ${leftovers.found}")
        }
        return result
    }
}

class JdkNetStripper extends ClassVisitor {
    JdkNetStripper(ClassVisitor next) { super(Opcodes.ASM9, next) }

    @Override
    MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exs) {
        return new JdkNetMethodStripper(super.visitMethod(access, name, desc, sig, exs))
    }
}

class JdkNetMethodStripper extends MethodVisitor {
    JdkNetMethodStripper(MethodVisitor next) { super(Opcodes.ASM9, next) }

    @Override
    void visitFieldInsn(int opcode, String owner, String name, String desc) {
        if (opcode == Opcodes.GETSTATIC && owner == "jdk/net/ExtendedSocketOptions") {
            super.visitInsn(Opcodes.ACONST_NULL)
        } else {
            super.visitFieldInsn(opcode, owner, name, desc)
        }
    }

    @Override
    void visitMethodInsn(int opcode, String owner, String name, String desc, boolean itf) {
        if (owner == "jdk/net/Sockets" && name == "setOption" && desc.endsWith(")V")
                && Type.getArgumentTypes(desc).length == 3) {
            3.times { super.visitInsn(Opcodes.POP) }
        } else if (owner == "jdk/net/Sockets" && name == "supportedOptions"
                && desc == "(Ljava/lang/Class;)Ljava/util/Set;") {
            super.visitInsn(Opcodes.POP)
            super.visitMethodInsn(Opcodes.INVOKESTATIC, "java/util/Collections", "emptySet", "()Ljava/util/Set;", false)
        } else {
            super.visitMethodInsn(opcode, owner, name, desc, itf)
        }
    }
}

/** Collects jdk/net instructions that survived the rewrite. */
class JdkNetScanner extends ClassVisitor {
    final List<String> found = []

    JdkNetScanner() { super(Opcodes.ASM9) }

    @Override
    MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exs) {
        return new JdkNetMethodScanner(name, found)
    }
}

class JdkNetMethodScanner extends MethodVisitor {
    private final String method
    private final List<String> found

    JdkNetMethodScanner(String method, List<String> found) {
        super(Opcodes.ASM9)
        this.method = method
        this.found = found
    }

    @Override
    void visitFieldInsn(int opcode, String owner, String name, String desc) {
        if (owner.startsWith("jdk/net/")) found << "$method: $owner.$name".toString()
    }

    @Override
    void visitMethodInsn(int opcode, String owner, String name, String desc, boolean itf) {
        if (owner.startsWith("jdk/net/")) found << "$method: $owner.$name$desc".toString()
    }
}

def patchHttpCore = tasks.register("patchHttpCore", PatchJdkNetTask) {
    sourceJars.from(configurations.httpcoreOriginal)
    outputJar.set(layout.buildDirectory.file("patched-libs/httpcore5-android.jar"))
}

dependencies {
    httpcoreOriginal libs.apache.httpcore

    implementation project(':core')
    implementation project(':server-jupnp')
    implementation project(':library:library')

    implementation libs.androidx.annotation
    implementation libs.androidx.core

    implementation libs.jupnp.android
    implementation libs.jupnp.support
    api files(patchHttpCore)
    api(libs.apache.http2core) {
        exclude group: 'org.apache.httpcomponents.core5', module: 'httpcore5'
    }

    implementation libs.kotlin.coroutines.core
    implementation libs.dagger.hilt.android
    ksp libs.dagger.hilt.compiler

    testImplementation libs.junit
}