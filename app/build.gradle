plugins {
    alias libs.plugins.android.application
    alias libs.plugins.devtools.ksp
    alias libs.plugins.dagger.hilt
}

android {
    compileSdk = libs.versions.compileSdkVersion.get() as Integer
    buildToolsVersion = libs.versions.buildTools.get()
    //buildTools( libs.versions.buildTools.get())

    defaultConfig {
        applicationId = "apincer.android.mmate"
        minSdk = libs.versions.minSdkVersion.get() as Integer
        targetSdk = libs.versions.targetSdkVersion.get() as Integer
        versionCode = 118
        versionName  = "3.18.10-"+ getDate()
        //noinspection ChromeOsAbiSupport
        ndk.abiFilters = ['arm64-v8a']
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
    }

    // Define the dimensions for your flavors
    flavorDimensions "database"
    productFlavors {
            ormlite {
                dimension = "database"
            }
            room {
                dimension = "database"
            }
    }

    compileOptions {
        // jetty12 required java 17
        sourceCompatibility = JavaLanguageVersion.of(17)
        targetCompatibility = JavaLanguageVersion.of(17)
    }

    kotlin {
        jvmToolchain(17)
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding = false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/library_release.kotlin_module',
                         'META-INF/library-core_release.kotlin_module',
                         'META-INF/LICENSE.md',
                         'META-INF/NOTICE.md',
                         'META-INF/AL2.0',
                         'META-INF/LGPL2.1',
                         'META-INF/INDEX.LIST',
                         'META-INF/io.netty.versions.properties',
                         'META-INF/io.netty.versions.properties']
            pickFirsts += ['META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    lint {
        abortOnError = true
    }

    namespace = 'apincer.android.mmate'
}

dependencies {
    // modules
    implementation project(':core')
    ormliteImplementation project(':db-ormlite')
    roomImplementation project(':db-room')

    // AndroidX
    implementation libs.androidx.annotation
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerView
    implementation libs.androidx.recyclerView.selection
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.appCompat
    implementation libs.androidx.fragment
    implementation libs.androidx.cardView
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.palette
    implementation libs.androidx.preference
    implementation libs.androidx.documentFile
    implementation libs.androidx.work
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.loader
    implementation libs.androidx.viewpager2
    implementation libs.androidx.swiperefreshlayout

    // media session
    implementation libs.androidx.media
    implementation libs.androidx.media3.session
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui

    implementation libs.kotlin.stdlib
    //libs.kotlin.stdlib.jdk8 removed - unnecessary with Kotlin 2.x
    implementation libs.kotlin.coroutines.core
    implementation libs.kotlinx.serialization.core

    // google
    implementation libs.google.material
    //libs.google.guava removed - unused

    // hilt
    implementation libs.dagger.hilt.android
    ksp libs.dagger.hilt.compiler
    implementation libs.androidx.hilt.lifecycle.viewmodel
    ksp libs.androidx.hilt.compiler

    // UI Libs
    //libs.skydoves.progressview removed - unused
    //libs.skydoves.androidribbon removed - unused
    //libs.skydoves.elasticviews removed - unused
    implementation libs.iwgang.simplifyspan
    implementation libs.androidfastscroll.kt
    implementation libs.chrisbanes.photoview
    implementation libs.philjay.mpandroidchart
    implementation libs.vanniktech.textbuilder
    implementation libs.sparrow007.carouselrecyclerview
    implementation libs.tutorialsandroid.filepicker
    implementation libs.zxing.core
    //implementation libs.commonmark

    //others
    implementation libs.anggrayudi.storage

    //libs.commons.codec removed - unused
    //libs.commons.io removed - replaced with Java standard I/O
    // commons-logging removed - SLF4J (slf4j-api) is already present and preferred
    implementation libs.commons.lang3
    //libs.commons.text removed - replaced with StringUtils.capitalize()
    implementation libs.commons.match3

    // jackson removed - migrated to kotlinx.serialization & org.json
    implementation libs.jetbrains.annotations
    implementation libs.slf4j.api
